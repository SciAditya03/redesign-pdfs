[project]
name = "document-intelligence-studio-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9",
  "pydantic>=2.8.0", "pydantic-settings>=2.4.0", "pymupdf>=1.24.3", "google-genai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
